<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Feedback Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Student Voice Portal</p>
      <h1>Student Feedback Manager</h1>
      <p class="subhead">Collect, review, and learn from student feedback in one place.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-header">
        <h2>Submit Feedback</h2>
        <p>Share your experience to help improve learning outcomes.</p>
      </div>

      <form id="feedbackForm" class="feedback-form">
        <label>
          <span>Your Name</span>
          <input type="text" id="name" placeholder="e.g., Alex Johnson" required />
        </label>

        <label>
          <span>Rating</span>
          <select id="rating" required>
            <option value="">Select Rating</option>
            <option value="1">1 - Needs work</option>
            <option value="2">2 - Fair</option>
            <option value="3">3 - Good</option>
            <option value="4">4 - Very Good</option>
            <option value="5">5 - Excellent</option>
          </select>
        </label>

        <label>
          <span>Comments</span>
          <textarea id="comment" placeholder="Tell us what worked and what could be better."></textarea>
        </label>

        <button type="submit" class="primary-btn">Submit Feedback</button>
        <p class="form-status" id="formStatus" role="status"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Latest Feedback</h2>
        <p>Every response is saved and visible to the team.</p>
      </div>

      <div id="feedbackList" class="feedback-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Student Feedback Manager &middot; </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
